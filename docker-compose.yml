services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-football_trivia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-football_trivia}
      API_PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://trivia-mundial-grido-frontend-9ngauc-c6c81b-77-37-40-248.traefik.me
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://trivia-mundial-grido-backend-9zsudp-66e500-77-37-40-248.traefik.me/api
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - dokploy-network

volumes:
  postgres_data:

networks:
  default:
  dokploy-network:
    external: true
